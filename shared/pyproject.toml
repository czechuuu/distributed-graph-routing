[project]
name = "dgr-shared"
version = "0.1.0"
description = "Shared code for distributed-graph-routing (including generated protobufs)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.64.1",
  "protobuf>=5.26.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared", "shared.protos"]

