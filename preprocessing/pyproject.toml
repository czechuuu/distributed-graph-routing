[project]
name = "preprocessing"
version = "0.1.0"
description = "Dataflow pipelines for preprocessing OSM road networks into sharded graph data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-beam[gcp]>=2.70.0",
    "build>=1.4.0",
    "functions-framework>=3.10.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-bigtable>=2.35.0",
    "grpcio>=1.64.1",
    "igraph>=0.11.0",
    "pip",
    "protobuf>=5.26.1",
    "setuptools",
    "crcmod",
    "s2sphere>=0.2.5",
    "osmium>=4.0.0",
    "pyarrow>=18.0.0",
]
