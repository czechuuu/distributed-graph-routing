[project]
name = "serving"
version = "0.1.0"
description = "Serving layer for routing API and shard workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dgr-shared",
    "fastapi>=0.111.0",
    "grpcio==1.64.1",
    "grpcio-tools==1.64.1",
    "google-cloud-storage>=2.17.0",
    "protobuf==5.26.1",
    "s2sphere>=0.2.5",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
dgr-shared = { workspace = true }
