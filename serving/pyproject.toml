[project]
name = "serving"
version = "0.1.0"
description = "Serving layer for routing API and shard workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dgr-shared",
    "fastapi>=0.111.0",
    "grpcio>=1.65.5",
    "grpcio-tools>=1.65.5",
    "google-cloud-storage>=2.17.0",
    "protobuf>=5.26.1",
    "s2sphere>=0.2.5",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
dgr-shared = { workspace = true }
