syntax = "proto3";

package routing;

message ShardGraph {
    repeated Edge edges = 1;
    repeated NodeLocation locations = 2;
}

message Edge {
    uint64 from_node_id = 1;
    uint64 to_node_id = 2;
    uint32 weight = 3;
    bool bidirectional = 4;
}

message NodeLocation {
    uint64 node_id = 1;
    float x = 2;
    float y = 3;
}

message ShortcutPath {
    repeated uint64 nodes = 1 [packed = true];
}

message ShardLookup {
    uint64 shard_id = 1;
}

message OverlayGraph {
    repeated Edge bridges = 1;
    repeated Edge shortcuts = 2;
}
