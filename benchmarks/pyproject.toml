[project]
name = "distributed-graph-routing-benchmarks"
version = "0.1.0"
description = "E2E benchmark framework for the distributed graph routing API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
run-benchmark = "benchmarks.run_benchmark:main"
